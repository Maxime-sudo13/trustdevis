<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrustDevis — Vérifier un devis</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
      input, select { width: 100%; padding: 10px; margin: 8px 0 16px; }
      button { padding: 12px 16px; font-weight: 600; }
      .small { color: #555; font-size: 13px; }
      .box { border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
      code { background: #f5f5f5; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>Vérifier un devis (MVP)</h1>
    <p class="small">FR / BE / LU — upload PDF ou photo. Résultat scoring arrive dans la phase suivante (OCR/normalisation/score).</p>

    <div class="box">
      <form action="/api/v1/estimate/upload" method="post" enctype="multipart/form-data">
        <label>Fichier (PDF/JPG/PNG)</label>
        <input type="file" name="file" required />

        <label>Secteur</label>
        <select name="sector" required>
          <option value="building.painting">Bâtiment — Peinture intérieure</option>
          <option value="mechanics.brakes">Mécanique — Freinage</option>
          <option value="mechanics.service">Mécanique — Révision/Vidange</option>
        </select>

        <label>Pays</label>
        <select name="country" required>
          <option value="FR">France</option>
          <option value="BE">Belgique</option>
          <option value="LU">Luxembourg</option>
        </select>

        <label>Region code (ex: FR-IDF, BE-BRU, LU-LU)</label>
        <input name="region_code" placeholder="FR-IDF" required />

        <label>Email (optionnel)</label>
        <input name="email" placeholder="email@exemple.com" />

        <label>
          <input type="checkbox" name="consent_training" value="true" required />
          J’accepte que TrustDevis anonymise et utilise ce devis (sans données personnelles) pour améliorer ses modèles.
        </label>

        <button type="submit">Envoyer</button>
      </form>
    </div>

    <p class="small">API santé: <code>/health</code></p>
  </body>
</html>
