<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Shield shape -->
  <path d="M100 20 L160 45 L160 95 Q160 145 100 175 Q40 145 40 95 L40 45 Z" 
        fill="none" stroke="url(#grad1)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Inner shield -->
  <path d="M100 32 L148 52 L148 93 Q148 135 100 160 Q52 135 52 93 L52 52 Z" 
        fill="url(#grad2)" opacity="0.15"/>
  
  <!-- Document icon -->
  <rect x="75" y="60" width="50" height="65" rx="4" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  <line x1="85" y1="75" x2="115" y2="75" stroke="url(#grad1)" stroke-width="2" opacity="0.7"/>
  <line x1="85" y1="85" x2="115" y2="85" stroke="url(#grad1)" stroke-width="2" opacity="0.7"/>
  <line x1="85" y1="95" x2="105" y2="95" stroke="url(#grad1)" stroke-width="2" opacity="0.7"/>
  
  <!-- Checkmark -->
  <path d="M70 95 L90 115 L130 75" fill="none" stroke="#10b981" stroke-width="5" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- TrustDevis text -->
  <text x="100" y="195" font-family="Outfit, system-ui, sans-serif" font-size="16" 
        font-weight="700" text-anchor="middle" fill="url(#grad1)">TrustDevis</text>
</svg>